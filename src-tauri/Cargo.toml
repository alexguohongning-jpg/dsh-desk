[package]
name = "dsh-desk"
version = "0.1.0"
description = "DSH Desktop shell: Tauri 2 + sidecar node + bundled dsh runtime"
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-shell = "2"
tauri-plugin-single-instance = "2"
tauri-plugin-updater = "2"
tauri-plugin-notification = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
regex = "1"

[profile.release]
strip = true
lto = true
